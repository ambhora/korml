[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "korml-language-docs"
version = "0.1.0"
description = "Language specification documentation for KORML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.7",
    "pygments>=2.17.0",
]

[project.entry-points."pygments.lexers"]
korml = "korml_docs_highlight.lexer:KormlLexer"

[tool.setuptools.packages.find]
where = ["src"]
